<header class="app-header">
  <div class="app-header-inner">
    <h1 class="brand"><a routerLink="/courses">{{ title() }}</a></h1>

    <nav class="app-nav" aria-label="Main">
      <a routerLink="/departments" routerLinkActive="active">Departments</a>
      <a routerLink="/courses" routerLinkActive="active">Courses</a>

      @if (auth.isLoggedIn()) {
        @let user = auth.currentUser();
        <a routerLink="/my-courses" routerLinkActive="active">My courses</a>
        <span class="nav-user">Logged in as <strong>{{ user ? user.name : '…' }}</strong></span>
        <button type="button" class="btn-secondary" (click)="onLogout()">Log out</button>
      } @else {
        <a class="nav-push" routerLink="/login" routerLinkActive="active">Log in</a>
        <a class="btn" routerLink="/register">Register</a>
      }
    </nav>
  </div>
</header>

<main class="app-main">
  @if (notifications.message(); as message) {
    <div class="notification" role="alert">
      <p>{{ message }}</p>
      <button type="button" class="btn-secondary" (click)="notifications.dismiss()">Dismiss</button>
    </div>
  }

  <router-outlet />
</main>
