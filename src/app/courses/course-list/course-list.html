<div class="page-header">
  <h2>Courses</h2>
  <button type="button" class="btn-secondary" (click)="reloadResources()">Reload</button>
</div>

@if (resource.hasValue()) {
  @if (resource.isLoading()) {
    <p class="status">Refreshing…</p>
  }
  <ul class="course-grid plain-list">
    @for (course of resource.value(); track course.id) {
      <li>
        <app-course-card [course]="course" />
      </li>
    } @empty {
      <li class="empty">No courses in the catalogue.</li>
    }
  </ul>
} @else if (resource.error()) {
  <p class="error">Could not load courses.</p>
} @else {
  <p class="status">Loading…</p>
}
